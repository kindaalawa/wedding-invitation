<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebration — September 25, 2026</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS Library for Direct Excel (.xlsx) Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            script: ['"Alex Brush"', 'cursive'],
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'],
          },
          colors: {
            ivory: '#FAF8F5',
            cashmere: '#F3EFEA',
            rosegold: '#C48B7F',
            softgold: '#D4B382',
            charcoal: '#222222',
            softgray: '#666666'
          }
        }
      }
    }
  </script>

  <style>
    .luxury-card {
      background: #FFFFFF;
      border: 1px solid rgba(212, 179, 130, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="bg-ivory text-charcoal font-sans antialiased pb-20">

  <!-- SONG REQUEST & SUGGESTION SECTION -->
  <section id="song-request" class="py-16 px-4">
    <div class="max-w-xl mx-auto luxury-card rounded-2xl p-8 sm:p-10 text-center space-y-6">
      
      <div class="space-y-1">
        <span class="text-3xl">🎵</span>
        <p class="font-sans text-xs tracking-widest uppercase text-rosegold font-semibold">Party Playlist</p>
        <h2 class="font-serif text-3xl sm:text-4xl text-charcoal">Suggest A Song</h2>
        <p class="text-xs text-softgray font-light">What track will get you on the dance floor on September 25, 2026?</p>
      </div>

      <!-- Success Notification -->
      <div id="song-success-msg" class="hidden bg-cashmere border border-softgold/40 rounded-xl p-4 text-xs text-charcoal">
        ✨ <span class="font-semibold">Song suggested!</span> Thanks for helping build our party playlist.
      </div>

      <!-- Song Suggestion Form -->
      <form id="song-form" onsubmit="handleSongSubmit(event)" class="space-y-3 text-left">
        <div>
          <label class="block font-sans text-[10px] uppercase tracking-widest text-softgray mb-1">Your Name *</label>
          <input type="text" id="guestSongName" required placeholder="e.g., Kinda" class="w-full bg-ivory border border-softgold/30 rounded-lg px-3.5 py-2.5 text-charcoal text-xs focus:outline-none focus:border-rosegold">
        </div>

        <div>
          <label class="block font-sans text-[10px] uppercase tracking-widest text-softgray mb-1">Song Title &amp; Artist *</label>
          <input type="text" id="songTitle" required placeholder="e.g., Perfect - Ed Sheeran" class="w-full bg-ivory border border-softgold/30 rounded-lg px-3.5 py-2.5 text-charcoal text-xs focus:outline-none focus:border-rosegold">
        </div>

        <div>
          <label class="block font-sans text-[10px] uppercase tracking-widest text-softgray mb-1">Optional Note / Moment (e.g., Entrance, Slow Dance)</label>
          <input type="text" id="songNote" placeholder="e.g., Play during dinner!" class="w-full bg-ivory border border-softgold/30 rounded-lg px-3.5 py-2.5 text-charcoal text-xs focus:outline-none focus:border-rosegold">
        </div>

        <button type="submit" class="w-full bg-rosegold hover:bg-charcoal text-white text-xs font-sans tracking-widest uppercase py-3.5 rounded-lg transition-all font-medium">
          Submit Song Suggestion 🎧
        </button>
      </form>

      <!-- ADMIN CONTROLS: Live Playlist & Export to Excel -->
      <div class="pt-6 border-t border-softgold/20 text-left space-y-3">
        <div class="flex items-center justify-between">
          <h4 class="font-serif text-lg text-charcoal">Suggested Playlist (<span id="song-count">0</span>)</h4>
          <button onclick="exportToExcel()" class="bg-charcoal hover:bg-rosegold text-white text-[10px] font-sans tracking-widest uppercase py-2 px-3 rounded-lg transition-all flex items-center gap-1.5 font-medium">
            📊 Download Excel (.xlsx)
          </button>
        </div>

        <div id="songs-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- Dynamic song entries appear here -->
        </div>
      </div>

    </div>
  </section>

  <script>
    // Storage array for submitted songs
    let suggestedSongs = [
      { Guest: "Sample Guest", Song: "A Thousand Years - Christina Perri", Note: "For slow dance", Date: "2026-09-08 11:00" }
    ];

    function renderSongList() {
      const container = document.getElementById('songs-list');
      const countLabel = document.getElementById('song-count');
      countLabel.innerText = suggestedSongs.length;
      container.innerHTML = '';

      suggestedSongs.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-cashmere p-3 rounded-lg border border-softgold/20 text-xs flex justify-between items-center gap-2";
        div.innerHTML = `
          <div>
            <p class="font-medium text-charcoal">${item.Song}</p>
            <p class="text-[10px] text-softgray">By <span class="font-semibold text-rosegold">${item.Guest}</span> ${item.Note ? `• ${item.Note}` : ''}</p>
          </div>
          <span class="text-[9px] text-slate-400">${item.Date.split(' ')[0]}</span>
        `;
        container.appendChild(div);
      });
    }

    // Submit song handler
    function handleSongSubmit(e) {
      e.preventDefault();
      const guest = document.getElementById('guestSongName').value;
      const song = document.getElementById('songTitle').value;
      const note = document.getElementById('songNote').value;
      const now = new Date().toISOString().replace('T', ' ').substring(0, 16);

      if (guest && song) {
        suggestedSongs.push({
          Guest: guest,
          Song: song,
          Note: note || "N/A",
          Date: now
        });

        renderSongList();

        // Show feedback message
        const msg = document.getElementById('song-success-msg');
        msg.classList.remove('hidden');
        document.getElementById('song-form').reset();

        setTimeout(() => msg.classList.add('hidden'), 4000);
      }
    }

    // EXPORT DIRECTLY TO EXCEL (.xlsx)
    function exportToExcel() {
      if (suggestedSongs.length === 0) {
        alert("No song suggestions to export yet!");
        return;
      }

      // Convert array of objects to worksheet using SheetJS
      const worksheet = XLSX.utils.json_to_sheet(suggestedSongs);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Wedding_Song_Suggestions");

      // Save file dynamically
      XLSX.writeFile(workbook, "Wedding_Song_Suggestions_2026.xlsx");
    }

    // Initial render on load
    renderSongList();
  </script>

</body>
</html>
